<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column;
           align-items: center; justify-content: center; height: 100vh; margin: 0; padding: 24px; box-sizing: border-box; }
    p { color: #444; margin-bottom: 24px; text-align: center; }
    a.primary { background: #111; color: white; padding: 16px 32px;
        border-radius: 8px; text-decoration: none; font-size: 16px; margin-bottom: 16px; }
    a.fallback { color: #6b7280; font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <p>Tap below to continue in the app.</p>
  <a href="" id="deeplink" class="primary">Open Meditation Lab</a>
  <a href="" id="fallback" class="fallback">Having trouble? Tap here</a>
  <script>
    var params = window.location.search;
    document.getElementById('deeplink').href =
      'https://www.meditationlab.co/reset-password' + params;
    document.getElementById('fallback').href =
      'meditationlab://reset-password' + params;
  </script>
</body>
</html>
